# Builds the Android app. Every build from main is numbered, signed with the
# app's own key, and published as a GitHub release; the installed app finds it
# there and offers to update itself (src/lib/app-update.ts).
#
# The signing key is committed encrypted (android/atlas-release.keystore.enc).
# Its password goes in the repository secret ATLAS_KEY_PASSWORD. Without that
# secret the build still works but uses a throwaway key and isn't published,
# because a phone couldn't install it over the existing app.
#
# Push notifications: the repository secret GOOGLE_SERVICES_JSON holds the
# google-services.json from Firebase (Project settings › Your apps › Android).
# Without it the app builds the same, with no push (it checks for messages
# on its own instead).
#
# The phone talks to https://traveltrack.grok.me unless a repository variable
# API_ORIGIN is set (Settings → Secrets and variables → Actions → Variables).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ATLAS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Keeps downloaded Android/Gradle libraries between builds, so each build
      # asks Maven Central for far less (it rate-limits GitHub's machines).
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci --no-audit --no-fund

      - name: Build app assets
        env:
          VITE_API_ORIGIN: ${{ vars.API_ORIGIN || 'https://traveltrack.grok.me' }}
        run: npm run build:app

      - name: Firebase config (push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret: building without push."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # A paste that isn't the right file would fail the build later with a worse message.
          node -e 'const j=JSON.parse(require("fs").readFileSync("android/app/google-services.json","utf8")); const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==="com.lazarmarlin.americanatlas"); if(!ok){console.error("google-services.json has no Android app com.lazarmarlin.americanatlas"); process.exit(1)}'
          echo "Push is set up for this build."

      - name: Unlock the signing key
        id: key
        env:
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
        run: |
          if [ -z "$ATLAS_KEY_PASSWORD" ]; then
            echo "No ATLAS_KEY_PASSWORD secret: building with a throwaway key, not publishing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/atlas-release.keystore.enc -out android/atlas-release.keystore \
            -pass env:ATLAS_KEY_PASSWORD
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        env:
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
        # Up to three tries: a "429 Too Many Requests" from a library server is
        # usually gone a minute later.
        run: |
          for try in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --init-script ci-mirror.gradle; then exit 0; fi
            [ "$try" = 3 ] && exit 1
            echo "Build failed (try $try); waiting before trying again."
            sleep $((try * 45))
          done

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk american-atlas-${{ github.run_number }}.apk

      - name: Publish the update
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          apk="american-atlas-${{ github.run_number }}.apk"
          # GitHub sometimes fails partway (a 502 during the upload leaves a draft
          # behind). Try a few times; anything left from a failed try (or from a
          # re-run of this build) is removed first so the release is made fresh.
          for try in 1 2 3; do
            for id in $(gh api "repos/${{ github.repository }}/releases?per_page=30" --jq ".[] | select(.tag_name == \"$tag\") | .id"); do
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
            done
            if gh release create "$tag" "$apk" \
                --target "${{ github.sha }}" --latest \
                --title "Build ${{ github.run_number }}" \
                --notes "$(git log -1 --format=%s)"; then
              break
            fi
            if [ "$try" = 3 ]; then exit 1; fi
            sleep 20
          done
          # Leftover drafts from earlier failures are never what the app should install.
          gh api "repos/${{ github.repository }}/releases?per_page=50" --jq '.[] | select(.draft and (.tag_name | startswith("build-")) and .tag_name != "'"$tag"'") | .id' |
            while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true; done || true
          # Keep the 10 newest builds. Tidying up never fails the build: the update is already out.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +11 |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag || true; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: american-atlas-debug-apk
          path: american-atlas-${{ github.run_number }}.apk
