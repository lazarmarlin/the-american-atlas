# Builds a debug APK of the Capacitor app. Download it from the run's
# "Artifacts" section and install it on an Android phone.
#
# The phone talks to https://traveltrack.grok.me unless a repository variable
# API_ORIGIN is set (Settings → Secrets and variables → Actions → Variables).
name: Android APK

on:
  workflow_dispatch:
  push:
    # feat/android-auto: the Android Auto work-in-progress branch, built so
    # its car screens get compiled and tested before they reach main.
    branches: [main, feat/android-auto]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci --no-audit --no-fund

      - name: Build app assets
        env:
          VITE_API_ORIGIN: ${{ vars.API_ORIGIN || 'https://traveltrack.grok.me' }}
        run: npm run build:app

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Show the Android Auto entries in the built APK
        working-directory: android
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT2" dump badging "$APK" | grep -E "^package:|application-label:|sdkVersion|targetSdk" || true
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -n -E "car|automotive|service|exported|category|MAP_TEMPLATES" || true
          "$AAPT2" dump xmltree --file res/xml/automotive_app_desc.xml "$APK" || echo "automotive_app_desc.xml missing"

      - uses: actions/upload-artifact@v4
        with:
          name: american-atlas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
